<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO BRO WINTER ADVENT CALENDAR</title>
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        .countdown-banner, #pre-release-countdown { 
            display: block !important;
            visibility: visible !important;
            color: white !important; /* Ensures numbers are visible */
            text-align: center !important;
        }
        .countdown-timer .time-unit span {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="calendar-wrapper">
        <header>
            <h1>DINO BRO WINTER ADVENT CALENDAR</h1>
            <div id="pre-release-countdown" class="countdown-banner">
                <p>[COUNTDOWN WILL BE HERE]</p>
                <div id="countdown-timer" class="countdown-timer"></div>
            </div>
            <div class="header-line"></div>
        </header>
        
        <main id="calendar-container" class="calendar-container">
            </main>
    </div>

    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div class="modal">
            <h2 id="modal-header">Title</h2>
            <div id="modal-content">Content</div>
            <button id="modal-ok-btn">OK</button>
        </div>
    </div>
    <div id="command-modal-backdrop" class="modal-backdrop hidden">
        <div class="modal command-modal">
            <h2>Admin Commands</h2>
            <div class="command-group">
                <h4>State Management</h4>
                <button id="reset-timer-btn">Reset Cooldown (Unstuck)</button>
            </div>
            <div class="command-group">
                <h4>Global Unlocks</h4>
                <button id="unlock-23-btn">Unlock Day 23</button>
                <button id="unlock-24-btn">Unlock Day 24</button>
                <button id="unlock-25-btn">Unlock Day 25</button>
            </div>
            <button id="command-close-btn">Close</button>
        </div>
    </div>
    <div id="command-hammer" class="command-hammer hidden">🔨</div>

    <script src="script.js"></script>
</body>
</html>
